name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Match soul's Ubuntu/glibc and Node major for native runtime dependencies.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BUILD_STANDALONE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: https://overme.cn
      NEXT_PUBLIC_REGISTRY_NAMESPACE: "@0verme"
      NEXT_PUBLIC_REGISTRY_NAMESPACE_URL: https://overme.cn/r/{name}.json
      # Required at prerender time by the GitHub contributions graph.
      NEXT_PUBLIC_GITHUB_CONTRIBUTIONS_API_URL: https://github-contributions-api.jogruber.de/v4
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        # Existing formatting debt stays visible without blocking release artifacts.
        continue-on-error: true
        run: pnpm format:check

      - name: Test
        run: pnpm test:run

      # Persist Next.js's build cache (.next/cache) between runs to avoid the
      # "No Cache Detected" warning and speed up rebuilds. The pnpm store is
      # already cached via `cache: pnpm` on setup-node, so only .next/cache is
      # cached here. Key busts on lockfile or source changes; restore-keys falls
      # back to the latest cache for the same lockfile when only source changed.
      # hashFiles has no brace expansion, so extensions are listed explicitly.
      - name: Cache Next.js build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-node22-standalone-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-node22-standalone-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-

      # Build MUST run before Typecheck: `tsc --noEmit` depends on the
      # `PageProps` global that Next.js generates into `.next/types/**` during
      # `next build`. On a fresh checkout (no `.next/`), `pnpm check-types` fails
      # with "Cannot find name 'PageProps'" until a build has generated those types.
      - name: Build (includes registry build via Bun)
        run: pnpm build

      - name: Typecheck
        run: pnpm check-types

      - name: Validate registry
        run: pnpm registry:validate

      - name: Assemble standalone release
        run: |
          mkdir -p build/release/.next
          cp -a .next/standalone/. build/release/
          cp -a .next/static build/release/.next/
          cp -a public build/release/
          # MDX and source viewers read source files; OG routes read local fonts.
          cp -a src build/release/
          # Runtime secrets must be supplied separately, never shipped in artifacts.
          find build/release -type f -name '.env*' -delete
          test -s build/release/server.js
          test -s build/release/.next/BUILD_ID
          test -d build/release/node_modules
          test -s build/release/src/assets/fonts/Geist-SemiBold.ttf
          test -s build/release/public/r/registry.json

      - name: Smoke test standalone release
        shell: bash
        run: |
          cd build/release
          HOSTNAME=127.0.0.1 PORT=3100 NODE_ENV=production node server.js > ../standalone.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 5 --output /dev/null http://127.0.0.1:3100/; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat ../standalone.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat ../standalone.log
            exit 1
          fi
          for route in /en /blog /en/blog /blog/hello-world /en/blog/hello-world /components/copy-button /insights /r/registry.json /llms.txt; do
            curl --fail --silent --show-error --max-time 60 --output /dev/null "http://127.0.0.1:3100$route"
          done
          static_file="$(find .next/static -type f -name '*.js' -print -quit)"
          test -n "$static_file"
          curl --fail --silent --show-error --max-time 60 --output /dev/null "http://127.0.0.1:3100/_next${static_file#.next}"
          curl --fail --silent --show-error --max-time 60 'http://127.0.0.1:3100/og/simple?title=CI' --output ../og.png
          node -e 'const fs = require("node:fs"); const image = fs.readFileSync("../og.png"); if (image.subarray(0, 8).toString("hex") !== "89504e470d0a1a0a") throw new Error("OG response is not PNG")'
          curl --fail --silent --show-error --max-time 60 -H 'Accept: text/markdown' http://127.0.0.1:3100/ --output ../index.md
          grep -q '^# ' ../index.md

      - name: Archive release
        run: |
          archive="overme-home-${GITHUB_SHA}-linux-x64.tar.gz"
          tar -czf "build/$archive" -C build/release .
          cd build
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload Linux release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: overme-home-linux-x64-${{ github.sha }}
          path: |
            build/overme-home-*-linux-x64.tar.gz
            build/overme-home-*-linux-x64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
