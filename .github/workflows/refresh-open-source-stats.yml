name: Refresh open-source stats

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-source-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Refresh generated stats
        run: bun run ./src/scripts/refresh-open-source-stats.mts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit visible changes
        run: |
          snapshot=src/features/portfolio/data/generated/open-source-stats.json
          if git diff --quiet -- "$snapshot"; then
            echo "No displayed stats changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$snapshot"
          git commit -m "chore: refresh open-source contribution stats"
          git push origin HEAD:main
